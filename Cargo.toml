[package]
name = "claude-recall"
version = "0.1.0"
edition = "2021"
description = "Full-text search and instant resume for Claude Code session history"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"

[profile.release]
lto = true
strip = true
