[package]
name = "claude-recall"
version = "0.1.1"
edition = "2021"
description = "Full-text search and instant resume for Claude Code session history"
license = "MIT"
repository = "https://github.com/mitkodkn/claude-recall"
keywords = ["claude-code", "claude", "search", "fts5", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"

[profile.release]
lto = true
strip = true
