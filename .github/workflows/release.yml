name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist/claude-recall
          cp target/${{ matrix.target }}/release/claude-recall dist/claude-recall/
          cp claude-recall.sh README.md LICENSE dist/claude-recall/
          cp -r extras dist/claude-recall/
          tar -C dist -czf claude-recall-${{ matrix.target }}.tar.gz claude-recall
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: claude-recall-${{ matrix.target }}.tar.gz
          generate_release_notes: true
